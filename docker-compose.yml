# =====================================================
# docker-compose.yml - RAIZ DO MONOREPO (desenvolvimento)
# -----------------------------------------------------
# Existem DOIS composes no projeto, ambos AQUI na raiz:
#   docker-compose.yml       <- este, desenvolvimento
#   docker-compose.prod.yml  <- producao (VPS + Traefik)
# NAO ha compose dentro de backend/ nem de web/.
#
# O front (web/) roda via `npm run dev` no HOST -- de proposito, nao por
# falta de service. Montar o codigo do Windows dentro do container exigiria
# polling pra detectar mudanca de arquivo, deixando o hot-reload mais lento
# que rodar direto. Em producao o web TEM service (build standalone, sem
# reload) -- por isso os dois composes diferem aqui, e isso e intencional.
#
# O PostgreSQL continua EXTERNO (VPS Hostinger, a mesma do N8N), acessado
# via DATABASE_URL no backend/.env. Nao ha Postgres de aplicacao aqui de
# proposito -- o `db-test` abaixo e efemero, so pra suite de integracao.
# =====================================================

services:
  # -----------------------------------------------------
  # api -- servico de APLICACAO (rodar o backend)
  # -----------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: task_manager_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    # Hot-reload em dev: monta o codigo do backend.
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -----------------------------------------------------
  # api-dev -- DESENVOLVIMENTO / TESTES (alembic, pytest, ruff, mypy)
  # Uso: docker compose run --rm api-dev alembic upgrade head
  #      docker compose run --rm api-dev pytest
  # -----------------------------------------------------
  api-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      # Spec 049, fatia A: `scripts/gen_permissions_ts.py` ESCREVE aqui, e
      # `tests/test_permissions_generated_ts.py` le daqui. Sem esta linha o
      # teste FALHA (de proposito, e nao pula) -- o CI tem o repo inteiro.
      - ./web/lib:/web/lib
    working_dir: /app
    entrypoint: []
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # -----------------------------------------------------
  # db-test -- Postgres EFEMERO da suite de integracao.
  # Suba com: docker compose up -d db-test
  # -----------------------------------------------------
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: taskmanager_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./backend/schema/00_test_extensions.sql:/docker-entrypoint-initdb.d/00_test_extensions.sql:ro

# Sem volumes de banco: Postgres externo, persiste fora deste compose.
