[project]
name = "task-manager-backend"
version = "0.1.0"
description = "Sistema de gestao de demandas/tarefas multi-tenant - backend"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    # --- ORM / DB ---
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    # --- Config / validacao ---
    # [email] traz o pacote email-validator, exigido pelo
    # tipo EmailStr usado nos schemas de autenticacao.
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",
    # --- Auth ---
    "pyjwt==2.10.1",
    "passlib[bcrypt]==1.7.4",
    # bcrypt fixado em 4.0.1: versoes 4.1+ removeram o atributo
    # __about__ que o passlib 1.7.4 ainda inspeciona, gerando
    # um warning ruidoso a cada hash. 4.0.1 e a ultima compativel.
    "bcrypt==4.0.1",
    # --- Logging estruturado ---
    "structlog==24.4.0",
    # --- Chamada de saida (Spec 043, fatia F) ---
    # ⚠️⚠️ RUNTIME, E NAO `dev`. O `aviso_de_status` importa `httpx` no topo do
    # modulo, e o `service.py` o importa em cascata -- entao um `httpx`
    # ausente derruba o IMPORT do app inteiro, nao so a chamada ao n8n.
    # Aconteceu em producao no deploy de 31/08: `ModuleNotFoundError: No
    # module named 'httpx'`, API fora do ar.
    #
    # ⚠️ E PASSOU POR TODOS OS PORTOES porque o `api-dev` instala `.[dev]`, e
    # ali o `httpx` ja existia (o cliente de teste HTTP usa ele). A imagem de
    # producao roda `pip install .`, sem o extra. Nenhum teste podia pegar
    # isso: o defeito nao esta no codigo, esta na diferenca entre as duas
    # instalacoes.
    "httpx==0.28.1",
    # --- Timezone (Spec 023) ---
    # ZoneInfo("America/Sao_Paulo") precisa da base de fusos; imagens slim
    # frequentemente nao trazem /usr/share/zoneinfo. tzdata (pure-data)
    # garante o fuso independente do SO base.
    "tzdata==2025.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    # ⚠️ `httpx` SAIU DAQUI e foi para as dependencias de RUNTIME (topo do
    # arquivo): o codigo de producao passou a usa-lo na fatia F, e mante-lo
    # aqui derrubou a API no deploy de 31/08.
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade,
# B = bugbear, ASYNC = flake8-async, RUF = ruff-specific
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]  # B008: chamadas em defaults sao o padrao do FastAPI (Depends())

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
# SQLAlchemy 2.0 ja tem typing nativo; sem plugin extra.
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Garante que o pacote `app` seja importavel ao rodar pytest
# a partir da raiz do projeto (necessario no container api-dev,
# onde o projeto e montado por volume e nao instalado).
pythonpath = ["."]
markers = [
    "integration: requer Postgres de teste (TEST_DATABASE_URL); pulado sem ele",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
