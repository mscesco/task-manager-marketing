# =====================================================
# alembic.ini
# A URL do banco NAO fica aqui -- e lida do .env em
# alembic/env.py (via app.core.config.settings), para nao
# duplicar configuracao nem versionar credenciais.
# =====================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# Nome dos arquivos de migration: timestamp + slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
