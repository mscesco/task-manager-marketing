# =====================================================
# docker-compose.prod.yml — deploy na VPS
# -----------------------------------------------------
# Anexa o app a infra que JA roda na VPS:
#   - rede  : root_default (onde vivem traefik e postgres do stack do n8n)
#   - banco : container `postgres` (postgres:16) -> alcancado por nome de
#             servico na rede, em postgres:5432 (NAO ha tunel aqui; o 15432
#             do dev e so da maquina local).
#   - proxy : container `traefik` ja existente -> roteamento por labels.
#
# NAO sobe Postgres nem Traefik aqui (eles ja existem). NAO expoe portas no
# host: todo o ingresso passa pelo Traefik (80/443).
#
# Migrations e bootstrap sao passos MANUAIS de deploy (ver DEPLOY.md / ADR 0022).
#
# -----------------------------------------------------
# HTTPS E CABECALHOS DE SEGURANCA
# -----------------------------------------------------
# A versao anterior deste arquivo colocava CADA servico em UM router ligado
# aos dois entrypoints (`web,websecure`) com `tls=true`. Isso deixa o
# comportamento do :80 dependente da configuracao estatica do Traefik, que
# mora no stack `root` (o do n8n) e nao aqui -- ou seja, fora do controle
# deste repo. Enquanto o token de sessao vive em localStorage, uma unica
# resposta servida em texto puro entrega a sessao inteira.
#
# Agora sao DOIS routers por servico:
#   - `*-http`  : entrypoint `web` (:80), sem TLS, unica funcao e devolver
#                 301 para https. Nao roteia para a aplicacao.
#   - `*` (o de sempre) : entrypoint `websecure` (:443), com TLS e os
#                 cabecalhos de seguranca.
#
# Os middlewares sao declarados UMA vez (no servico `api`) e referenciados
# pelos dois servicos. Prefixo `tm-` evita colisao com middlewares do stack
# do n8n, que dividem o mesmo Traefik.
#
# ⚠️ HSTS -- O ENSAIO ACABOU. A linha efetiva ja esta em `stsSeconds=31536000`
# (um ano). Ate 06/08/2026 este cabecalho dizia "ESTE ARQUIVO ESTA EM MODO
# ENSAIO (stsSeconds=300)" enquanto a linha real ja era de um ano ha dias --
# comentario que mente sobre a configuracao logo abaixo dele e pior que
# comentario nenhum, porque quem confere le o comentario e para.
#
# O HSTS e gravado NO BROWSER DE CADA PESSOA: enquanto o prazo nao vence, o
# browser recusa http neste host sozinho, e NAO existe nada do lado do
# servidor que desfaca isso. Por isso ele SUBIU com 300 (cinco minutos):
# protegia igual no dia a dia e expirava sozinho se algo desse errado.
#
# ⚠️ AGORA QUE E UM ANO, VOLTAR ATRAS NAO E POSSIVEL. Baixar o valor aqui nao
# limpa o que ja esta gravado nos browsers -- so o tempo faz isso. Se este
# host precisar de http por qualquer motivo, ele nao vai ter.
#
# CSP FICOU DE FORA DE PROPOSITO. O Next injeta script inline (inclusive o
# script de tema em app/layout.tsx) e uma CSP sem nonce derruba a aplicacao
# em branco, sem erro visivel. CSP e entrega propria, com nonce, testada em
# dev antes. Nao acrescente aqui na pressa.
# =====================================================

name: task-manager

networks:
  # Rede ja existente (do compose do n8n). external=true: nao criamos, so
  # entramos nela. Confirme o nome com `docker network ls` (aqui: root_default).
  proxy:
    external: true
    name: root_default

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: task-manager-api:latest
    container_name: task-manager-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"

      # ---------------------------------------------------------------
      # MIDDLEWARES (declarados aqui, usados pelos dois servicos)
      # ---------------------------------------------------------------
      # Redirect permanente http -> https.
      - "traefik.http.middlewares.tm-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tm-https.redirectscheme.permanent=true"

      # Cabecalhos de seguranca aplicados a toda resposta em https.
      #   stsSeconds            : 31536000 = UM ANO. O ensaio de 300 acabou;
      #                           ver o aviso no topo do arquivo. Nao baixar:
      #                           o valor ja gravado nos browsers nao volta.
      #   stsIncludeSubdomains  : FALSE de proposito -- hstgr.cloud e dominio
      #                           de terceiro, compartilhado. Nunca marque
      #                           true aqui.
      #   frameDeny             : proibe <iframe> do app (anti clickjacking).
      #   contentTypeNosniff    : impede o browser de adivinhar Content-Type.
      #   referrerPolicy        : nao vaza o path (que contem id de tarefa)
      #                           para dominios de terceiros.
      - "traefik.http.middlewares.tm-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tm-sec.headers.stsIncludeSubdomains=false"
      - "traefik.http.middlewares.tm-sec.headers.stsPreload=false"
      - "traefik.http.middlewares.tm-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.tm-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.tm-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      # ⚠️ A CSP E A PERMISSIONS-POLICY NAO MORAM AQUI, e isso e proposital
      # (revisao de seguranca, 23/09): elas descrevem o que o CODIGO do front
      # carrega -- os dominios do GIPHY estao em `web/lib/giphy.ts` --, entao
      # vivem em `web/next.config.mjs`, com teste em `lib/__tests__/csp.test.ts`.
      #
      # ⚠️ NAO ACRESCENTE UMA AQUI. Dois cabecalhos `Content-Security-Policy` na
      # mesma resposta nao se somam: o navegador aplica a INTERSECAO dos dois, e
      # o efeito de afrouxar um deles e nenhum -- enquanto apertar o outro
      # quebra a tela sem que o arquivo culpado apareca.

      # ---------------------------------------------------------------
      # ROUTER :80 -- so redireciona, nao entrega conteudo
      # ---------------------------------------------------------------
      - "traefik.http.routers.tm-api-http.rule=Host(`task.srv1186064.hstgr.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tm-api-http.priority=100"
      - "traefik.http.routers.tm-api-http.entrypoints=web"
      - "traefik.http.routers.tm-api-http.middlewares=tm-https"

      # ---------------------------------------------------------------
      # ROUTER :443 -- /api -> backend. Prioridade ALTA pra ganhar do
      # catch-all do web.
      # ---------------------------------------------------------------
      - "traefik.http.routers.tm-api.rule=Host(`task.srv1186064.hstgr.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tm-api.priority=100"
      - "traefik.http.routers.tm-api.entrypoints=websecure"
      - "traefik.http.routers.tm-api.tls=true"
      - "traefik.http.routers.tm-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.tm-api.middlewares=tm-sec"
      - "traefik.http.services.tm-api.loadbalancer.server.port=8000"
    # Healthcheck: bate em /health/ready (readiness -> confirma o Postgres).
    # Usa o proprio Python: a imagem slim NAO tem curl/wget. urlopen lanca em
    # 5xx/conexao recusada -> exit != 0 -> unhealthy. Marca o container como
    # unhealthy no `docker ps` e da ao Traefik sinal pra nao rotear pra ele.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period generoso: migration e boot do pool nao contam como falha.
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_GIPHY_KEY e assada no bundle em build time. Vem do arquivo
      # .env na raiz (mesma pasta deste compose), lido pelo compose p/
      # interpolar ${...}. Ausente -> vazia -> picker de GIF some, sem quebrar.
      args:
        NEXT_PUBLIC_GIPHY_KEY: ${NEXT_PUBLIC_GIPHY_KEY:-}
    image: task-manager-web:latest
    container_name: task-manager-web
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"

      # ---------------------------------------------------------------
      # ROUTER :80 -- so redireciona.
      # ---------------------------------------------------------------
      - "traefik.http.routers.tm-web-http.rule=Host(`task.srv1186064.hstgr.cloud`)"
      - "traefik.http.routers.tm-web-http.priority=1"
      - "traefik.http.routers.tm-web-http.entrypoints=web"
      - "traefik.http.routers.tm-web-http.middlewares=tm-https"

      # ---------------------------------------------------------------
      # ROUTER :443 -- catch-all do mesmo host -> front. Prioridade menor
      # que a do /api.
      # ---------------------------------------------------------------
      - "traefik.http.routers.tm-web.rule=Host(`task.srv1186064.hstgr.cloud`)"
      - "traefik.http.routers.tm-web.priority=1"
      - "traefik.http.routers.tm-web.entrypoints=websecure"
      - "traefik.http.routers.tm-web.tls=true"
      - "traefik.http.routers.tm-web.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.tm-web.middlewares=tm-sec"
      - "traefik.http.services.tm-web.loadbalancer.server.port=3000"
    # Healthcheck: o server standalone do Next responde 200 em "/". node:alpine
    # tb nao tem curl -> usa o proprio node. Erro de conexao ou 5xx -> exit 1.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
